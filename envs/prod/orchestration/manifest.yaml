apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: monitoring
  name: datalake-pipeline-alerts
  namespace: datalake-orchestration
spec:
  groups:
    - name: datalake-pipeline
      rules:
        - alert: WorkflowFailed
          annotations:
            description: 'argo_workflows_total_count{exported_namespace,phase} is a per-namespace, per-phase COUNTER (verified live against the controller''s own /metrics AND against Prometheus''s own stored series, 2026-07-12, on the old kind cluster''s `argo-workflows` namespace -- see this group''s header comment on why `exported_namespace`, not the scraped `namespace` label, carries the workflow''s actual namespace; Plan 5 retargets the literal to `datalake-orchestration`, the prod tenant namespace these Workflows now run in) -- increase() over 1h counts workflows that TRANSITIONED into Failed or Error during that window, which is what "entering Failed/Error in the last hour" means; a gauge read (argo_workflows_gauge, also present but with NO namespace label at all on this controller) would miss a transition already reaped by ttlStrategy before the next scrape, or hide which namespace it belonged to. Covers every Workflow in ns datalake-orchestration: ingest-nightly (both its run-nightly and run-retention steps -- see RetentionUnverifiedRows below for one specific run-retention failure cause), ingest-sitesonar, ingest-maintenance, and hello. E1 was exactly the un-alerted failure class this closes: 68 consecutive nightly failures, unnoticed, because nothing watched workflow/CronWorkflow outcomes (deliverables/2026-07-12-datalake-v2-design.md, minimum alert set: "workflow/CronWorkflow failure (E1)").'
            incident: E1
            note: phase="Error" has no time series until some workflow has actually entered that phase at least once (Prometheus only creates a series on first observation, verified live -- only Failed/Running/Succeeded existed at verification time) -- absent is expected, not broken, until then.
            summary: An Argo Workflow in datalake-orchestration entered Failed/Error in the last hour
          expr: increase(argo_workflows_total_count{exported_namespace="datalake-orchestration", phase=~"Failed|Error"}[1h]) > 0
          for: 5m
          labels:
            severity: warning
        - alert: IcebergIngestStale
          annotations:
            description: 'argo_workflows_cronworkflows_triggered_total{name="ingest-nightly"} is the ONLY controller metric carrying a per-CronWorkflow `name` label (verified live, 2026-07-12 -- see this group''s header comment). It counts TRIGGERS, not successes, so this expr detects "the 02:00 schedule stopped firing at all" (controller down, CronWorkflow suspended/deleted/renamed, ns issue) within a 26h window (24h nightly cadence + 2h buffer) -- increase()==0 means zero triggers landed in that window. It deliberately does NOT try to detect "triggered nightly but every run failed" -- that is a DIFFERENT failure mode, already covered within 1h (not 26h) by WorkflowFailed above, since a failing ingest-nightly Workflow increments argo_workflows_total_count{phase="Failed"} regardless of which CronWorkflow spawned it, and no per-workflow-name success/failure metric exists on this controller version to scope that more tightly (verified live -- see header comment). Together the two alerts split "pipeline didn''t run at all" (this one) from "pipeline ran and failed" (WorkflowFailed) -- the most honest split obtainable from this controller version''s real metric label surface. Design''s minimum alert set: "ingestion watermark lag >24h (E4)" -- deliverables/2026-07-12-datalake-v2-design.md.'
            incident: E4
            summary: ingest-nightly has not even been triggered in 26h
          expr: increase(argo_workflows_cronworkflows_triggered_total{name="ingest-nightly", exported_namespace="datalake-orchestration"}[26h]) == 0
          for: 5m
          labels:
            severity: critical
        - alert: RetentionUnverifiedRows
          annotations:
            description: 'Deliberate no-new-components decision (Plan 2 Task 5): retention.py (design D5, provenance E4/E6) exposes NO metric of its own -- a Pushgateway-fed unverified_count gauge was rejected because it adds a new component to the platform purely to surface one exit code. Instead, retention.run()''s exit_code() (ingest/src/alice_ingest/retention.py) returns non-zero IF AND ONLY IF total.unverified > 0 summed across every landing table, which fails the run-retention container, which fails the owning ingest-nightly Workflow -- the EXACT SAME Failed-phase transition WorkflowFailed above already detects (there is no per-workflow-name metric on this controller to scope a narrower expr against, verified live -- see this group''s header comment). This alert therefore has NO independent Prometheus signal: its expr is identical to WorkflowFailed''s, and it will always co-fire with WorkflowFailed, never alone, for this specific cause among the several WorkflowFailed''s broader condition can match. It exists as a separately named, runbook-linkable entry -- so "retention''s safety net tripped" is discoverable by name -- rather than folding this failure mode silently into WorkflowFailed''s generic text. To CONFIRM unverified>0 was the actual cause (vs. a different workflow, or ingest-nightly''s run-nightly step, failing instead), check the failed run-retention pod''s logs for the `RETENTION kept=<n> deleted=<n> unverified=<n>` summary line (unverified>0) or a per-table `RETENTION table=<t> ... unverified=<n>` line (retention.py''s format_summary()/run()). unverified>0 means old landing rows exist that retention could NOT verify are safely replicated to Iceberg yet -- retention kept them rather than risk E4''s class of data loss (deleting rows an interrupted/lagging ingest never finished writing).'
            incident: E4
            summary: A pipeline workflow failed -- check whether retention's unverified>0 guard was the cause
          expr: increase(argo_workflows_total_count{exported_namespace="datalake-orchestration", phase=~"Failed|Error"}[1h]) > 0
          for: 5m
          labels:
            severity: warning
        - alert: IcebergSnapshotStale
          annotations:
            description: 'Deliberate no-new-components decision (Plan 3 Task 3): the data-layer freshness gate (alice_ingest.maintenance. run_freshness_check(), wired as ingest-nightly''s third DAG step `check-freshness`, templates/ingest-cronworkflows.yaml) exposes NO metric of its own -- it fails its own container on staleness, which fails the owning Workflow, which this PrometheusRule group already detects via WorkflowFailed. This alert has NO independent Prometheus signal: same expr as WorkflowFailed, always co-firing with it, never alone, for this specific cause among WorkflowFailed''s broader condition. A core table (job_info/trace/mon_jdls_parsed) reads STALE when its newest Iceberg snapshot (`max(committed_at)` from `lake.alice."<table>$snapshots"`) is older than 26h, or MISSING if the table has no snapshot at all -- either means the data-layer has nothing recent to show even if every upstream step reported success.'
            incident: E4
            summary: A pipeline workflow failed -- check whether the data-layer freshness gate (check-freshness) was the cause
          expr: increase(argo_workflows_total_count{exported_namespace="datalake-orchestration", phase=~"Failed|Error"}[1h]) > 0
          for: 5m
          labels:
            severity: warning
        - alert: WorkflowChronicFailure
          annotations:
            description: argo_workflows_total_count{exported_namespace="datalake-orchestration", phase=~"Failed|Error"} has accumulated 3 or more Failed/Error transitions in a rolling 7-day window. WorkflowFailed (above) already pages on every individual failure at `warning`; this rule escalates to `critical` once failures are a pattern, not an isolated blip -- unmitigated, this repeats E1 (68 consecutive nightly failures, unnoticed for months, because nothing distinguished "failed once" from "failing every night").
            incident: E1
            summary: 3+ Argo Workflow failures in datalake-orchestration within 7 days -- chronic, not a one-off
          expr: increase(argo_workflows_total_count{exported_namespace="datalake-orchestration", phase=~"Failed|Error"}[7d]) >= 3
          for: 5m
          labels:
            severity: critical
        - alert: SiteSonarStale
          annotations:
            description: 'Same trigger-staleness shape as IcebergIngestStale (this group, above) but for the `ingest-sitesonar` CronWorkflow (values.yaml''s `ingest.schedules.sitesonar`, daily 03:00 default): 24h cadence + 2h buffer. Detects "the schedule stopped firing at all" (controller down, CronWorkflow suspended/deleted/renamed); does NOT detect "triggered but failed", which WorkflowFailed already covers within 1h. `warning`, not `critical`: site-sonar populates auxiliary metadata (site_sonar table), not the core job_info/trace/ mon_jdls_parsed tables IcebergIngestStale protects at `critical`.'
            incident: E4
            summary: ingest-sitesonar has not even been triggered in 26h
          expr: increase(argo_workflows_cronworkflows_triggered_total{name="ingest-sitesonar", exported_namespace="datalake-orchestration"}[26h]) == 0
          for: 5m
          labels:
            severity: warning
        - alert: IcebergMaintenanceStale
          annotations:
            description: argo_workflows_cronworkflows_triggered_total{name="ingest-maintenance"} counts TRIGGERS, not successes or real-vs-deferred runs (see this alert's own annotation above for the deferral blind spot this does NOT cover). increase()==0 over 8d (7d weekly cadence + 1d buffer) means the Sunday 04:00 schedule stopped firing entirely -- controller down, CronWorkflow suspended/ deleted/renamed, or an RBAC/namespace issue.
            incident: E4-adjacent
            summary: ingest-maintenance has not even been triggered in 8 days
          expr: increase(argo_workflows_cronworkflows_triggered_total{name="ingest-maintenance", exported_namespace="datalake-orchestration"}[8d]) == 0
          for: 5m
          labels:
            severity: warning
