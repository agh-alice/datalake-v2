apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: datalake-orchestration
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-runner
  namespace: datalake-orchestration
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch
  - apiGroups:
      - argoproj.io
    resources:
      - workflows
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner
  namespace: datalake-orchestration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-runner
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: datalake-orchestration
---
apiVersion: v1
kind: Service
metadata:
  name: echo-receiver
  namespace: datalake-orchestration
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: echo-receiver
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-receiver
  namespace: datalake-orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-receiver
  template:
    metadata:
      labels:
        app: echo-receiver
    spec:
      containers:
        - args:
            - |
              import http.server

              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_POST(self):
                      length = int(self.headers.get("Content-Length", 0) or 0)
                      body = self.rfile.read(length)
                      print("ECHO-RECEIVER POST path=" + self.path, flush=True)
                      print(body.decode("utf-8", "replace"), flush=True)
                      self.send_response(200)
                      # Alertmanager's Slack notifier requires literal "ok" or {"ok":true} in response body
                      response_body = b"ok"
                      self.send_header("Content-Length", str(len(response_body)))
                      self.end_headers()
                      self.wfile.write(response_body)

                  def log_message(self, fmt, *args):
                      pass

              http.server.HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          command:
            - python3
            - -c
          image: ghcr.io/agh-alice/datalake-v2-ingest@sha256:898ae4ee94a4a255ee8e973dce1a3fe65a226f2d08cb0b25a243862e06948767
          name: echo-receiver
          ports:
            - containerPort: 8080
          readinessProbe:
            initialDelaySeconds: 2
            periodSeconds: 5
            tcpSocket:
              port: 8080
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: hello
  namespace: datalake-orchestration
spec:
  concurrencyPolicy: Forbid
  schedules:
    - '*/5 * * * *'
  workflowSpec:
    entrypoint: main
    serviceAccountName: pipeline-runner
    templates:
      - container:
          command:
            - sh
            - -c
            - echo hello from datalake-v2 && date
          image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          resources:
            limits:
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
        name: main
    ttlStrategy:
      secondsAfterCompletion: 3600
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: ingest-nightly
  namespace: datalake-orchestration
spec:
  concurrencyPolicy: Forbid
  schedules:
    - 0 */6 * * *
  workflowSpec:
    activeDeadlineSeconds: 21600
    entrypoint: main
    serviceAccountName: pipeline-runner
    templates:
      - dag:
          tasks:
            - name: run-nightly
              template: run-nightly
            - dependencies:
                - run-nightly
              name: run-retention
              template: run-retention
            - dependencies:
                - run-retention
              name: check-freshness
              template: check-freshness
        name: main
      - container:
          args:
            - run-nightly
          envFrom:
            - secretRef:
                name: ingest-env
          image: ghcr.io/agh-alice/datalake-v2-ingest@sha256:898ae4ee94a4a255ee8e973dce1a3fe65a226f2d08cb0b25a243862e06948767
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 1
              memory: 2Gi
        name: run-nightly
      - container:
          args:
            - run-retention
          envFrom:
            - secretRef:
                name: ingest-env
          image: ghcr.io/agh-alice/datalake-v2-ingest@sha256:898ae4ee94a4a255ee8e973dce1a3fe65a226f2d08cb0b25a243862e06948767
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
        name: run-retention
      - container:
          args:
            - check-freshness
          envFrom:
            - secretRef:
                name: ingest-env
          image: ghcr.io/agh-alice/datalake-v2-ingest@sha256:898ae4ee94a4a255ee8e973dce1a3fe65a226f2d08cb0b25a243862e06948767
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
        name: check-freshness
    ttlStrategy:
      secondsAfterCompletion: 86400
---
