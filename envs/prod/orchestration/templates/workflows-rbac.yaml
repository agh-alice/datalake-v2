# Minimal RBAC for Plan 2's CronWorkflows: the emissary executor (Argo
# Workflows v4 default) needs only create/patch on workflowtaskresults to
# report step outcomes back to the controller -- it does not touch the
# Workflow object directly.
#
# P3T3 review Important 1 (ingest/src/alice_ingest/maintenance.py's module
# docstring, "P3T3 review Important 1" section): the nightly-vs-maintenance
# overlap guard's `WorkflowsClient` needs get/list on `workflows` (the
# argoproj.io Workflow objects a CronWorkflow spawns, distinct from
# `workflowtaskresults` above) to check whether `ingest-nightly` is
# currently Running before `run-trino-maintenance` issues any Trino
# statement. Smallest possible widening: read-only (get/list, no
# write/delete verb), namespace-scoped to `datalake-orchestration` (same
# Role every CronWorkflow's pipeline-runner SA already uses -- this guard
# only runs from the maintenance CronWorkflow's pod, but the SA is shared
# across all three CronWorkflows, so the widening is visible to all of
# them even though only one uses it).
#
# Plan 5 Task 1: retargeted from the old umbrella chart's `argo-workflows`
# namespace to `datalake-orchestration` (platform-owned, one of the three
# tenant namespaces -- Plan 5's orchestration tier). Still namespace-scoped
# Role/RoleBinding, not cluster-scoped -- passes the seam gate unchanged.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: datalake-orchestration
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-runner
  namespace: datalake-orchestration
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner
  namespace: datalake-orchestration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-runner
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: datalake-orchestration
