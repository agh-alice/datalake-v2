# Plan 5 Task 3 Step 4: the `ingest-env` Secret every ingest CronWorkflow
# step consumes via envFrom (templates/ingest-cronworkflows.yaml). Field
# list and remote key names match values.yaml's "Env-var contract" comment
# exactly -- see that comment for the secretStoreRef/remoteRef.property
# rationale (identical to envs/prod/storage/templates/external-secrets.yaml).
#
# SITESONAR_LIMIT (independent-review finding, 2026-08-07, resolved): a
# conditional 11th entry, values-gated on `.Values.ingest.sitesonarLimit`
# rather than always listed -- prod leaves that value empty (values.yaml
# default), so prod's ExternalSecret never requests this property at all
# and the real unbounded backlog drain is untouched. kind's values-kind.yaml
# sets it to "5", so kind's render DOES request it -- hack/kind-up.sh
# provisions the matching remote-secret literal so ESO has something to
# resolve.
#
# See envs/prod/storage/templates/external-secrets.yaml for the
# target.deletionPolicy: Delete rationale below (independent-review
# finding, 2026-08-07 -- ESO 2.8.0's default is Retain, live-verified,
# which would leave revoked ingest-env credentials, e.g. PG_URL/S3 keys,
# materialised and in use by the next CronWorkflow tick indefinitely;
# identical comment there, not repeated here).
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ingest-env
  namespace: datalake-orchestration
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform
    kind: ClusterSecretStore
  target:
    name: ingest-env
    deletionPolicy: Delete
  data:
    - secretKey: PG_URL
      remoteRef: {key: ingest-env, property: PG_URL}
    - secretKey: S3_ENDPOINT
      remoteRef: {key: ingest-env, property: S3_ENDPOINT}
    - secretKey: S3_ACCESS_KEY
      remoteRef: {key: ingest-env, property: S3_ACCESS_KEY}
    - secretKey: S3_SECRET_KEY
      remoteRef: {key: ingest-env, property: S3_SECRET_KEY}
    - secretKey: S3_BUCKET
      remoteRef: {key: ingest-env, property: S3_BUCKET}
    - secretKey: S3_REGION
      remoteRef: {key: ingest-env, property: S3_REGION}
    - secretKey: LAKEKEEPER_URI
      remoteRef: {key: ingest-env, property: LAKEKEEPER_URI}
    - secretKey: LAKEKEEPER_WAREHOUSE
      remoteRef: {key: ingest-env, property: LAKEKEEPER_WAREHOUSE}
    - secretKey: RETENTION_DAYS
      remoteRef: {key: ingest-env, property: RETENTION_DAYS}
    - secretKey: TRINO_URI
      remoteRef: {key: ingest-env, property: TRINO_URI}
    {{- if .Values.ingest.sitesonarLimit }}
    - secretKey: SITESONAR_LIMIT
      remoteRef: {key: ingest-env, property: SITESONAR_LIMIT}
    {{- end }}
{{- end }}
