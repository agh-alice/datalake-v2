# (Plan 5 Task 1: envs/prod/orchestration IS the prod overlay now, so
# there is no separate cyfronet values file to keep). Its only real value
# key (ingest.retentionDays: "14") duplicated the base default above and
# is not repeated as a second layer; the illustrative documentation is
# preserved below, DNS/namespace names updated for the three-tier split.
#
# ingest (Plan 2 Task 6): no Helm-templated plaintext Secret exists for
# `datalake-orchestration/ingest-env` in this chart -- same
# "no-secrets-in-rendered-branches" convention as lakekeeper-pg-encryption
# (envs/prod/storage/values.yaml's comment). On kind, hack/kind-up.sh
# creates `ingest-env` directly from harness-generated/in-cluster values.
# On the prod tenant cluster it is now sourced via a real ExternalSecret
# (Plan 5 Task 3, templates/external-secrets.yaml) against the platform's
# ClusterSecretStore `platform` (verified live 2026-08-06 -- superseding
# the "<platform ClusterSecretStore name, TO VERIFY>" placeholder this
# comment used to carry). remoteRef uses `property` (not just `key`,
# which the illustrative sketch this replaces omitted) -- ESO's Kubernetes
# provider JSON-encodes the WHOLE remote Secret when `property` is absent
# (verified against external-secrets.io/latest/provider/kubernetes); every
# item below points at the single remote Secret `ingest-env` in
# eso-secret-source, selecting one field each via `property`.
#
# Env-var contract (docs/runbooks/ingestion-pipeline.md owns the
# authoritative table) with in-cluster DNS names updated for the
# three-tier split -- S3/object-storage VALUES are still TO VERIFY against
# real cyfronet/platform credentials (Plan 4 gate G2); the delivery
# MECHANISM (this ExternalSecret) is Plan 5 Task 3's job and is done:
#   PG_URL                postgresql://mon_user:<REDACTED>@mon-data-rw.datalake-storage:5432/mon_data
#   S3_ENDPOINT            <platform/cyfronet S3 endpoint>              # TO VERIFY
#   S3_ACCESS_KEY          <platform/cyfronet S3 access key id>         # TO VERIFY
#   S3_SECRET_KEY           <platform/cyfronet S3 secret access key>     # TO VERIFY
#   S3_BUCKET              <bucket>/<key-prefix>                       # TO VERIFY --
#                          bucket AND key-prefix both required, see
#                          hack/kind-up.sh's "CRITICAL FINDING" comment
#   S3_REGION              <region, or any non-empty string>            # TO VERIFY
#   LAKEKEEPER_URI         http://lakekeeper.datalake-storage.svc:8181   # namespace updated, Plan 5 Task 1
#   LAKEKEEPER_WAREHOUSE   default
#   RETENTION_DAYS         "14"                                        # keep in sync with ingest.retentionDays above
#   TRINO_URI              http://trino.datalake-compute.svc:8080       # namespace updated, Plan 5 Task 1;
#                          non-secret (final review R1) -- required per-command by
#                          check-freshness/run-trino-maintenance/apply-views, see
#                          docs/runbooks/ingestion-pipeline.md section 2
