# orchestration tier -- Plan 5 Task 1 split of the former umbrella
# chart/values.yaml (base) and chart/values-cyfronet.yaml (prod overlay,
# folded in here: envs/prod/orchestration IS the prod deployment now,
# there is no separate cyfronet overlay file in the split layout). Renders
# into namespace datalake-orchestration.

# hello CronWorkflow values-gate (Plan-1 final-review N6, Plan 3 Task 5):
# it exists purely as a workflow-execution canary for kind-verify's manual
# probe (hack/kind-verify.sh queries `cronworkflow hello` for its pinned
# busybox image, then submits a throwaway Workflow using that image) --
# there is no reason for the prod tenant cluster to run a no-op "echo
# hello" CronWorkflow on a schedule forever. Base default FALSE (prod
# inherits this, no override needed); this chart's values-kind.yaml
# overrides to TRUE (Task 4) so the canary exists on kind, where
# kind-verify's probe needs it.
helloCron:
  enabled: false
  # Plan 5 Task 3 Step 3: trivial canary container (busybox echo+date) --
  # every container needs requests regardless of whether it's enabled by
  # default (the platform's ResourceQuota applies to any pod that runs,
  # including on kind where values-kind.yaml turns this on).
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 32Mi}

# Plan 5 Task 3 Step 4: gates templates/external-secrets.yaml. Superseding
# note (Task 4): kind runs its own `platform` ClusterSecretStore (see
# envs/prod/storage/values.yaml's identical note) -- values-kind.yaml does
# NOT override this to false; it stays true on kind too, same store name
# as production. Independent-review finding (2026-08-07, resolved): Task 4
# left a gap here -- SITESONAR_LIMIT (see ingest.sitesonarLimit above) had
# no ExternalSecret data: entry at all, so kind inherited prod's daily
# SiteSonar schedule with no way to bound the first-ever unbounded fetch
# against the real alimonitor.cern.ch backlog. Closed: the data: entry
# below is now values-gated (`{{- if .Values.ingest.sitesonarLimit }}`),
# empty/unset by default (prod's ExternalSecret is byte-for-byte the same
# 10-property request it always was), populated by values-kind.yaml.
externalSecrets:
  enabled: true

# echo-receiver: kind-only Slack-webhook stand-in the `slack-datalake`
# Alertmanager receiver posts to (the platform's Alertmanager, per Plan 5
# context -- Alertmanager itself is now platform-owned) -- proves the
# whole route/group/inhibit/receiver pipeline end-to-end without a real
# Slack workspace. Same values-gate shape as helloCron above: base default
# FALSE (prod inherits this -- gets a real Slack webhook via ESO instead,
# Plan 5 Task 3), values-kind.yaml overrides to TRUE (Task 4). See
# templates/echo-receiver.yaml.
echoReceiver:
  enabled: false

# Digest-pinned per no-mutable-tags convention. Verified via:
#   docker pull busybox:1.36 && docker inspect busybox:1.36 \
#     --format '{{index .RepoDigests 0}}'
# (Task 7). Consumed by templates/hello-cronworkflow.yaml.
#
# ingest: built from ingest/ (Plan 2 Task 2); ghcr.io/agh-alice/datalake-v2-ingest
# is public, digest published by .github/workflows/ingest-image.yaml's job
# summary on every push to main touching ingest/**. Manual pin (not
# auto-committed) is deliberate -- the chart change is the deploy and stays
# reviewable in the rendered-branch diff. Pinned from CI run 29221689753
# (commit 7d5e848, ingest-image workflow, Plan 3 final-review R2: exclude
# Trino OPTIMIZE replace-snapshots from the freshness gate -- the prior pin
# [sha256:a1871900...] predates it); verified two ways, both agreeing:
# `docker buildx imagetools inspect ghcr.io/agh-alice/datalake-v2-ingest:
# 7d5e848deece1504aa2e0bbfeec2bcbe53178c66` (`Digest:` field) and the GHCR
# registry API (`GET /v2/agh-alice/datalake-v2-ingest/manifests/<digest>`
# with an anonymous pull token + an explicit multi-format Accept header,
# HTTP 200 -- a bare request with no Accept header returned a misleading
# 404 here) -- same index-manifest structure as the previous pin. Consumed
# by templates/ingest-cronworkflows.yaml (Task 4 nightly/sitesonar, Task 5
# maintenance) and hack/run-ingest-once.sh/hack/kind-verify.sh's probes
# (via `yq -r '.images.ingest' <values file>`).
images:
  busybox: "busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
  ingest: "ghcr.io/agh-alice/datalake-v2-ingest@sha256:898ae4ee94a4a255ee8e973dce1a3fe65a226f2d08cb0b25a243862e06948767"

# CronWorkflow scheduling (Plan 2 Task 4). Consumed by
# templates/ingest-cronworkflows.yaml's `.Values.ingest.schedules.*`.
# retentionDays documents the retention window operators must keep in sync
# with the ingest-env Secret's RETENTION_DAYS key (harness-created --
# hack/kind-up.sh on kind, ExternalSecret on the prod tenant cluster --
# same no-secrets-in-rendered-branches convention as lakekeeperDb's
# encryption key, envs/prod/storage/values.yaml); it is NOT consumed by
# any chart template directly, since the CronWorkflow's run-retention step
# gets RETENTION_DAYS via envFrom the Secret, not from values -- this
# field exists so the intended value is visible in Git even though the
# actual runtime value is set out-of-band.
ingest:
  # Independent-review finding (2026-08-07): base default empty string --
  # `{{- if .Values.ingest.sitesonarLimit }}` in templates/
  # external-secrets.yaml only renders the SITESONAR_LIMIT data: entry when
  # this is non-empty, so prod's ExternalSecret keeps requesting exactly
  # the same 10 properties it always has (unbounded backlog drain stays
  # the prod behavior, unchanged). values-kind.yaml overrides this to "5"
  # -- see that file's comment for why kind needs a bound at all, and
  # hack/kind-up.sh for the matching remote-secret literal.
  sitesonarLimit: ""
  schedules:
    nightly: "0 2 * * *"
    sitesonar: "0 3 * * *"
    # Plan 2 Task 5: weekly Iceberg snapshot expiry (ingest/src/alice_ingest/
    # maintenance.py). Sunday 04:00 -- outside nightly's 02:00 and
    # sitesonar's 03:00 windows so it never contends with either for the
    # landing-DB/Lakekeeper connection, and weekly (not nightly) because
    # snapshot accumulation across one day of nightly + sitesonar merges is
    # not large enough to need daily expiry (design D12).
    maintenance: "0 4 * * 0"
  # Final-review N5: every CronWorkflow's workflowSpec gets an
  # `activeDeadlineSeconds` ceiling -- a stuck pod (network partition on a
  # PG/Lakekeeper/S3 call, a hung site-sonar HTTP fetch, etc.) previously
  # had no upper bound at all and would run (and hold `concurrencyPolicy:
  # Forbid`'s slot) indefinitely, silently blocking every subsequent
  # scheduled tick. Defaults sized to each job's normal shape: nightly and
  # sitesonar at 6h (21600s -- generous headroom over the ~1-2 min kind
  # runs in task-*-report.md's acceptance timings, but bounded against a
  # genuine hang; sitesonar's real cyfronet backlog is the larger of the
  # two, per sitesonar.py's module docstring), maintenance at 1h (3600s --
  # a single expire_snapshots() pass per table, no external HTTP fetch).
  # Values-driven (not hardcoded in the template) so an environment can
  # override per its own SLA without a chart change.
  activeDeadlineSeconds:
    nightly: 21600
    sitesonar: 21600
    maintenance: 3600
  retentionDays: "14"
  # Plan 5 Task 3 Step 3: CPU + memory requests/limits per DAG step
  # (templates/ingest-cronworkflows.yaml). `run-nightly` (the dlt
  # ingestion + JDL canonicalization leg) is sized directly from
  # cyfronet-cluster-requirements.md's already-agreed figure -- "Ingest
  # CronWorkflows: transient 2-4GiB nightly (request 2/limit 4; set at
  # cyfronet activation -- tracked ride-along N6)" -- this task is that
  # activation. CPU held at 1 (not more): the dress rehearsal's real-data
  # finding was that the JDL leg is single-core CPU-bound (research/
  # 2026-07-13_production-data-dress-rehearsal.md, ~45h projected for the
  # full 9.9M backlog at that rate) -- a higher CPU request wouldn't speed
  # up a single-threaded stage, but the request still needs to be >= what
  # one core's worth of sustained work needs to avoid throttling during
  # the backfill burst. The other steps are lighter DB/HTTP-bound legs,
  # scaled down from run-nightly's baseline. concurrencyPolicy: Forbid
  # keeps each CronWorkflow's own steps sequential (DAG dependencies, only
  # one step's pod exists at a time within one Workflow), but nightly
  # (up to its 6h activeDeadlineSeconds) can in principle still overlap a
  # neighboring CronWorkflow's own run -- worst-case concurrent total
  # (nightly's heaviest step + sitesonar + trino-maintenance) is well
  # under the orchestration tier's 8 CPU / 16Gi agreed quota (see
  # task-3-report.md for the arithmetic).
  resources:
    nightly:
      requests: {cpu: 1, memory: 2Gi}
      limits: {memory: 4Gi}
    retention:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {memory: 1Gi}
    freshness:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
    sitesonar:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {memory: 2Gi}
    maintenance:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {memory: 1Gi}
    trinoMaintenance:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {memory: 1Gi}

