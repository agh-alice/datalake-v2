# Folded in from the old umbrella chart's chart/values-cyfronet.yaml
# (Plan 5 Task 1: envs/prod/orchestration IS the prod overlay now, so
# there is no separate cyfronet values file to keep). Its only real value
# key (ingest.retentionDays: "14") duplicated the base default above and
# is not repeated as a second layer; the illustrative documentation is
# preserved below, DNS/namespace names updated for the three-tier split.
# No new ExternalSecret resource is created by this task (Plan 5 Task 3's
# job) -- this remains documentation only, same as it was before the split.
#
# ingest (Plan 2 Task 6): no Helm-templated Secret or ExternalSecret exists
# for `datalake-orchestration/ingest-env` in this chart -- same
# "no-secrets-in-rendered-branches" convention as lakekeeper-pg-encryption
# (envs/prod/storage/values.yaml's comment). On kind, hack/kind-up.sh
# creates `ingest-env` directly from harness-generated/in-cluster values.
# On the prod tenant cluster it must be sourced via an ExternalSecret
# instead, against the platform's ClusterSecretStore (Plan 5 Task 3;
# same pattern docs/runbooks/bootstrap-cyfronet.md §5 already used for
# lakekeeper-pg-encryption) -- applied once, out-of-band, NOT by this
# chart:
#
#   apiVersion: external-secrets.io/v1
#   kind: ExternalSecret
#   metadata: {name: ingest-env, namespace: datalake-orchestration}
#   spec:
#     refreshInterval: 1h
#     secretStoreRef: {name: <platform ClusterSecretStore name, TO VERIFY>, kind: ClusterSecretStore}
#     target: {name: ingest-env}
#     data:
#       - {secretKey: PG_URL, remoteRef: {key: ingest-pg-url}}
#       - {secretKey: S3_ENDPOINT, remoteRef: {key: ingest-s3-endpoint}}
#       - {secretKey: S3_ACCESS_KEY, remoteRef: {key: ingest-s3-access-key}}
#       - {secretKey: S3_SECRET_KEY, remoteRef: {key: ingest-s3-secret-key}}
#       - {secretKey: S3_BUCKET, remoteRef: {key: ingest-s3-bucket}}
#       - {secretKey: S3_REGION, remoteRef: {key: ingest-s3-region}}
#       - {secretKey: LAKEKEEPER_URI, remoteRef: {key: ingest-lakekeeper-uri}}
#       - {secretKey: LAKEKEEPER_WAREHOUSE, remoteRef: {key: ingest-lakekeeper-warehouse}}
#       - {secretKey: RETENTION_DAYS, remoteRef: {key: ingest-retention-days}}
#       - {secretKey: TRINO_URI, remoteRef: {key: ingest-trino-uri}}
#
# Illustrative env-var contract (docs/runbooks/ingestion-pipeline.md owns
# the authoritative table) with in-cluster DNS names updated for the
# three-tier split -- S3/object-storage values are still TO VERIFY against
# real cyfronet/platform credentials (Plan 5 Task 3):
#   PG_URL                postgresql://mon_user:<REDACTED>@mon-data-rw.datalake-storage:5432/mon_data
#   S3_ENDPOINT            <platform/cyfronet S3 endpoint>              # TO VERIFY
#   S3_ACCESS_KEY          <platform/cyfronet S3 access key id>         # TO VERIFY
#   S3_SECRET_KEY           <platform/cyfronet S3 secret access key>     # TO VERIFY
#   S3_BUCKET              <bucket>/<key-prefix>                       # TO VERIFY --
#                          bucket AND key-prefix both required, see
#                          hack/kind-up.sh's "CRITICAL FINDING" comment
#   S3_REGION              <region, or any non-empty string>            # TO VERIFY
#   LAKEKEEPER_URI         http://lakekeeper.datalake-storage.svc:8181   # namespace updated, Plan 5 Task 1
#   LAKEKEEPER_WAREHOUSE   default
#   RETENTION_DAYS         "14"                                        # keep in sync with ingest.retentionDays above
#   TRINO_URI              http://trino.datalake-compute.svc:8080       # namespace updated, Plan 5 Task 1;
#                          non-secret (final review R1) -- required per-command by
#                          check-freshness/run-trino-maintenance/apply-views, see
#                          docs/runbooks/ingestion-pipeline.md section 2
