# environment: kind -- Task 4 population, restoring the pre-split
# chart/values-kind.yaml overrides (commit 1466141^) that Task 1
# deliberately deferred to this task.

# hello CronWorkflow: kind-verify's manual workflow-execution canary
# depends on this (values.yaml's comment). Base default stays false so
# prod never runs it.
helloCron:
  enabled: true

# echo-receiver: kind-only Slack-webhook stand-in the platform's
# Alertmanager (environments/kind/infra/monitoring.yaml -- kind-only,
# installs the same kube-prometheus-stack the platform provides in prod)
# posts to. Base default stays false so prod never runs it (prod gets a
# real Slack webhook via ESO once the owner provides one).
echoReceiver:
  enabled: true

# CronWorkflow scheduling: restored from the pre-split chart/
# values-kind.yaml lineage.
#
# nightly: tightened to every 6h (vs. prod's once-daily 02:00) purely for
# kind-cluster observability (`kubectl get cronworkflow -w` shows a tick
# within a working session). Safe to tighten: run-nightly/run-retention/
# check-freshness only touch the in-cluster landing DB + Iceberg/MinIO,
# no external network call, no unbounded-fetch risk.
#
# sitesonar: LEFT AT PROD'S DEFAULT (unset here -- inherits values.yaml's
# `0 3 * * *`), not restored to the historical `30 */6 * * *`. Tightening
# the cadence back is safe now that sitesonarLimit (below) bounds every
# tick to 5 files regardless of schedule -- deliberately not done here to
# keep this fix's diff to the actual safety gap, not a cosmetic cadence
# change; a future task can tighten it if kind-cluster sitesonar
# observability within a working session is worth it.
#
# Independent-review finding (2026-08-07, resolved): the historical
# tightened sitesonar schedule was only ever safe because hack/kind-up.sh
# (pre-ESO) set `SITESONAR_LIMIT=5` directly in the plaintext `ingest-env`
# Secret it created by hand -- `alice_ingest.sitesonar._resolve_limit()`'s
# only bound on a FIRST-EVER run (no dlt high-water-mark state yet)
# against the real, live alimonitor.cern.ch backlog (verified reachable
# from this host, 2026-08-06 -- 1740+ files, tens of GB decompressed per
# sitesonar.py's own module docstring). Task 3 moved `ingest-env` onto a
# real ExternalSecret (templates/external-secrets.yaml) whose `data:` list
# did not include SITESONAR_LIMIT at all, and Task 4's file scope didn't
# extend to that template -- so kind was left inheriting prod's daily
# schedule with NO bound: a kind cluster left running past 03:00 would
# fire an unbounded first-ever sitesonar tick against the live CERN
# endpoint. Closed: `sitesonarLimit` below is a values-gated 11th
# ExternalSecret data: entry (templates/external-secrets.yaml,
# `.Values.ingest.sitesonarLimit`), empty/unset on prod so its
# ExternalSecret is unchanged; hack/kind-up.sh provisions the matching
# remote-secret literal so kind's ESO sync actually has SITESONAR_LIMIT to
# resolve.
ingest:
  sitesonarLimit: "5"
  schedules:
    nightly: "0 */6 * * *"
