---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: monitoring
  name: datalake-alerts
  namespace: datalake-storage
spec:
  groups:
    - name: datalake
      rules:
        - alert: LandingDBXidAgeHigh
          annotations:
            description: cnpg_pg_database_xid_age has exceeded 1e9 for 30m. Unmitigated, this repeats E4 -- the landing DB hit transaction-ID wraparound protection and refused all writes for two months, unnoticed, because orphaned temp tables pinned the frozen-XID horizon.
            incident: E4
            runbook_url: docs/runbooks/xid-wraparound.md
            summary: Landing DB transaction-ID age approaching wraparound
          expr: max by (namespace, job) (cnpg_pg_database_xid_age{namespace="datalake-storage", job="datalake-storage/mon-data"}) > 1000000000
          for: 30m
          labels:
            cluster: mon-data
            severity: critical
        - alert: CNPGClusterUnhealthy
          annotations:
            description: cnpg_pg_replication_streaming_replicas (max across lakekeeper-db's pods, i.e. the primary's view) has been below 1 for 15m -- HA is degraded. E5 was the RAID0-over-4-volumes VM with zero redundancy that CNPG replaces.
            incident: E5
            summary: CNPG cluster lakekeeper-db has fewer streaming replicas than expected
          expr: max by (namespace, job) (cnpg_pg_replication_streaming_replicas{namespace="datalake-storage", job="datalake-storage/lakekeeper-db"}) < 1
          for: 15m
          labels:
            cluster: lakekeeper-db
            severity: critical
---
apiVersion: v1
kind: Pod
metadata:
  annotations:
    helm.sh/hook: test
  labels:
    app.kubernetes.io/instance: datalake-storage
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: lakekeeper
    app.kubernetes.io/part-of: lakekeeper
    app.kubernetes.io/version: 0.12.2
    component: catalog
    helm.sh/chart: lakekeeper-0.11.0
  name: lakekeeper-test-bootstrap
  namespace: datalake-storage
spec:
  containers:
    - args:
        - |
          set -e
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          BOOTSTRAP_URL="http://lakekeeper:8181/management/v1/bootstrap"
          if [ -n "$TOKEN" ]; then
            echo "Found K8s Service Account token"
          else
            echo "No K8s Service Account token found"
          fi
          for i in {1..45}; do
            RESPONSE=$(curl --location "$BOOTSTRAP_URL" \
              --header 'Content-Type: application/json' \
              --header "Authorization: Bearer $TOKEN" \
              --data '{"accept-terms-of-use": true}' \
              --write-out "HTTP_CODE:%{http_code}" --silent --output /dev/null)

            if [[ "$RESPONSE" == *"HTTP_CODE:204"* ]]; then
              echo "Bootstrapping successful"
              exit 0
            else
              echo "Request failed with status code and response: $RESPONSE"
            fi

            sleep 2
          done
          echo "Failed to bootstrap within the given time"
          exit 1
      command:
        - sh
        - -c
      image: curlimages/curl:latest
      name: base
  restartPolicy: Never
  serviceAccountName: lakekeeper
---
