apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: catalog
    app.kubernetes.io/instance: datalake-storage
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: lakekeeper
    app.kubernetes.io/part-of: lakekeeper
    app.kubernetes.io/version: 0.12.2
    helm.sh/chart: lakekeeper-0.11.0
  name: lakekeeper
  namespace: datalake-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: catalog
      app.kubernetes.io/instance: datalake-storage
      app.kubernetes.io/name: lakekeeper
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/secret-config-envs: 949a2111b3a0f1b4e48f54daacb91e90b634a7d15b79e815dbc1dd4fdb5e0009
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      labels:
        app.kubernetes.io/component: catalog
        app.kubernetes.io/instance: datalake-storage
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: lakekeeper
        app.kubernetes.io/part-of: lakekeeper
        app.kubernetes.io/version: 0.12.2
        helm.sh/chart: lakekeeper-0.11.0
    spec:
      containers:
        - args:
            - serve
          env:
            - name: LAKEKEEPER__PG_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: lakekeeper-db-app
            - name: LAKEKEEPER__PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: lakekeeper-db-app
            - name: LAKEKEEPER__PG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: encryptionKey
                  name: lakekeeper-pg-encryption
            - name: LAKEKEEPER__PLACEHOLDER
              value: placeholder
          envFrom:
            - secretRef:
                name: lakekeeper-config-envs
          image: quay.io/lakekeeper/catalog:v0.12.2
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 5
          name: lakekeeper
          ports:
            - containerPort: 8181
              name: http
              protocol: TCP
            - containerPort: 9000
              name: metrics
              protocol: TCP
          readinessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsGroup: 65534
            runAsUser: 65532
      initContainers:
        - args:
            - wait-for-db
            - -dm
            - -r
            - "100"
            - -b
            - "2"
          env:
            - name: LAKEKEEPER__PG_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: lakekeeper-db-app
            - name: LAKEKEEPER__PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: lakekeeper-db-app
            - name: LAKEKEEPER__PG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: encryptionKey
                  name: lakekeeper-pg-encryption
            - name: LAKEKEEPER__PLACEHOLDER
              value: placeholder
          envFrom:
            - secretRef:
                name: lakekeeper-config-envs
          image: quay.io/lakekeeper/catalog:v0.12.2
          imagePullPolicy: IfNotPresent
          name: check-db
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
          securityContext:
            runAsGroup: 65534
            runAsUser: 65532
      nodeSelector:
        pool: db
      restartPolicy: Always
      serviceAccountName: lakekeeper
      tolerations:
        - effect: NoExecute
          key: node.kubernetes.io/not-ready
          operator: Exists
          tolerationSeconds: 300
        - effect: NoExecute
          key: node.kubernetes.io/unreachable
          operator: Exists
          tolerationSeconds: 300
---
