# Landing DB replacing the RAID0 VM (design D7). max_connections deliberately
# low: the historical multi-client scaling attempts DDoSed Postgres (E6).
#
# Plan 5 Task 1: retargeted from the old umbrella chart's dedicated
# `landing-db` namespace to `datalake-storage` (platform-owned, one of the
# three tenant namespaces -- Plan 5's storage tier).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mon-data
  namespace: datalake-storage
  # Rollback-hazard fix (docs/runbooks/bootstrap-cyfronet.md §3): the
  # platform's ApplicationSet arms `syncPolicy.automated: {prune: true,
  # selfHeal: true}` and git is our only control surface -- "revert the
  # hydrated branch" is the entire emergency lever. Without this
  # annotation a revert that drops this Cluster from the rendered
  # manifest deletes it live, the operator tears the instance down, and
  # the PVC goes with it via ownerReference (survives only as an
  # orphaned volume if the StorageClass retains -- `cinder-perf` does,
  # `reclaimPolicy: Retain`, live-verified 2026-08-07 -- but recovery is
  # then a manual PV-rebinding exercise mid-incident). Two distinct sync
  # options, two distinct deletion paths (ArgoCD docs, pinned
  # v3.5.0-rc2): Prune=false covers normal sync-time pruning (a revert
  # removing this block from the rendered manifest); Delete=false covers
  # the separate cascading-delete-on-Application-deletion path (their
  # docs' own example is "retain PVCs even after your application is
  # deleted") -- relevant here because we can't inspect the hub's
  # ApplicationSet to know whether it sets the
  # resources-finalizer.argocd.argoproj.io cascade finalizer (same
  # "unverified from our side" class as this runbook's other hub-side
  # gaps, §5). Both cost nothing when not triggered. Actually
  # decommissioning this Cluster requires removing both and deleting the
  # object by hand, deliberately, which is the point.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: {{ .Values.landingDb.instances }}
  # Digest-pinned per no-mutable-tags convention (Plan-1 final-review N2) --
  # see templates/lakekeeper-db.yaml's comment for the verification
  # method (same digest, same upstream image, both Clusters pin together).
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6@sha256:53be6d727c7b3cf0df2b147f7ce7cdd31d37fd285314294871a4ccc3837b6872
  storage:
    size: {{ .Values.landingDb.storageSize }}
    storageClass: {{ .Values.landingDb.storageClass }}
  # Plan 5 Task 3 Step 2: cluster.spec.affinity.{nodeSelector,tolerations}
  # verified live via `kubectl explain cluster.spec.affinity` (CNPG 1.30 on
  # alice-k8s-datalake) -- applies to every instance's pod.
  affinity:
    nodeSelector:
      {{- toYaml .Values.placement.nodeSelector | nindent 6 }}
    tolerations:
      {{- toYaml .Values.placement.tolerations | nindent 6 }}
  resources:
    {{- toYaml .Values.landingDb.resources | nindent 4 }}
  postgresql:
    parameters:
      max_connections: {{ .Values.landingDb.maxConnections | quote }}
      # E4 (XID wraparound) protection is monitoring, not tuning: the LandingDBXidAgeHigh
      # alert (Task 6 / design D11) + CNPG's exported cnpg_pg_database_xid_age metric.
  bootstrap:
    initdb:
      database: mon_data
      owner: mon_user
  # Plan 5 Task 3 Step 5: enablePodMonitor (CNPG's deprecated built-in
  # toggle) retired here -- it cannot carry `release: monitoring`, the
  # platform Prometheus's only adoption gate (values.yaml's `monitoring`
  # section comment has the full citation). templates/monitoring.yaml
  # hand-authors this cluster's PodMonitor instead.
