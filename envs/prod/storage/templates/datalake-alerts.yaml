# Design D11 — failure-derived alert set (E4/E5/E2).
#
# Plan 5 Task 1: this PrometheusRule is the storage-tier half of the old
# umbrella chart's chart/templates/datalake-alerts.yaml, split per the
# plan's Step 1 instruction ("pipeline/workflow rules -> orchestration,
# database rules -> storage"). This file keeps the original `datalake`
# group (database/CNPG/disk/ArgoCD-sync reliability rules); the pipeline-
# specific `datalake-pipeline` group moved to
# envs/prod/orchestration/templates/datalake-alerts.yaml. NodeDiskPressure
# and ArgoAppOutOfSync don't watch a database metric specifically, but
# they were never workflow/pipeline rules either -- placed here by
# elimination, same group as before the split.
#
# NOT done here (Plan 5 Task 3's job, not Task 1's -- "structural split
# only"): adding `release: monitoring` (Global Constraint, Task 3 Step 5
# explicitly owns it).
#
# Plan 5 Task 1 review fix: the platform's Prometheus was inspected
# 2026-08-05 -- `ruleSelector: {matchLabels: {release: monitoring}}`,
# `ruleNamespaceSelector: {}` (empty = all namespaces). Adoption of any
# PrometheusRule here therefore depends ONLY on the `release: monitoring`
# label (Task 3 Step 5 adds it), not on namespace placement.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: datalake-alerts
  namespace: datalake-storage
spec:
  groups:
    - name: datalake
      rules:
        # Plan 5 Task 1 review fix: this expr carried no selector at all --
        # written when we owned the whole cluster. On the shared platform
        # cluster, bare `cnpg_pg_database_xid_age` matches every tenant's
        # CNPG database, not just ours. Scoped to mon-data specifically,
        # same job-label shape already verified live for
        # cnpg_pg_replication_streaming_replicas below (`job` =
        # "<namespace>/<cluster>", the CNPG Prometheus exporter's
        # convention across its cnpg_pg_* metric family) -- not
        # independently re-verified live for xid_age itself, flagging that
        # alongside the same live-reverify follow-up already noted below.
        # `by (namespace, job)` + the static `cluster` label mirror the
        # CNPGClusterUnhealthy treatment for consistency, though this alert
        # has no identity-collision partner of its own.
        - alert: LandingDBXidAgeHigh
          expr: max by (namespace, job) (cnpg_pg_database_xid_age{namespace="datalake-storage", job="datalake-storage/mon-data"}) > 1000000000
          for: 30m
          labels:
            severity: critical
            cluster: mon-data
          annotations:
            summary: Landing DB transaction-ID age approaching wraparound
            description: >-
              cnpg_pg_database_xid_age has exceeded 1e9 for 30m. Unmitigated,
              this repeats E4 -- the landing DB hit transaction-ID
              wraparound protection and refused all writes for two months,
              unnoticed, because orphaned temp tables pinned the frozen-XID
              horizon.
            incident: E4
            runbook_url: docs/runbooks/xid-wraparound.md

        # Task 6 review finding: cnpg_pg_replication_streaming_replicas is reported
        # per-pod (each pod's own count of replicas streaming *from* it), not
        # per-cluster. A cascading-free CNPG cluster's replica pods always report 0
        # (nothing streams downstream of a replica) and a single-instance cluster has
        # no replicas by design -- the original `< 1` expr fired on every healthy
        # replica pod and on kind's deliberately single-instance mon-data. Fixed by
        # taking the max across each cluster's pods (the primary's count is the
        # cluster's true streaming-replica count) and comparing against a
        # values-driven threshold (instances - 1), rendered only when the cluster is
        # actually configured for HA (instances > 1) -- on kind, landingDb.instances
        # is 1 (values-kind.yaml), so this block is intentionally absent for mon-data.
        #
        # Deviation from plan: cnpg_pg_replication_streaming_replicas carries no
        # `cluster` label (verified live via Prometheus /api/v1/series -- only
        # container/endpoint/instance/job/namespace/pod are present; `job` is
        # "<namespace>/<cluster>" and only cnpg_collector_up, a different metric,
        # carries a `cluster` label). Each CNPG Cluster in the OLD umbrella chart
        # lived in its own dedicated namespace (lakekeeper-db.yaml -> ns lakekeeper,
        # landing-db.yaml -> ns landing-db), so `namespace` alone uniquely
        # identified the cluster and was used as the grouping/matching label.
        #
        # Plan 5 Task 1 fix (forced by the namespace retarget, not new alert
        # logic): both CNPG clusters now live in the SAME namespace
        # (datalake-storage, templates/{landing-db,lakekeeper-db}.yaml) --
        # `namespace=` alone can no longer tell mon-data's pods from
        # lakekeeper-db's. Switched to the `job` label instead, using the
        # exact "<namespace>/<cluster>" shape this same comment already
        # documented as verified live -- `job="datalake-storage/mon-data"`
        # and `job="datalake-storage/lakekeeper-db"` respectively. Not
        # re-verified live against the prod tenant cluster (no cluster
        # access from this task); flagging that as a Task 3 (monitoring
        # integration) follow-up check once PrometheusRules actually sync.
        #
        # Plan 5 Task 1 review fix (alert-identity collision): the `job`
        # selector above fixes which series each expr READS, but
        # `max by (namespace)` was stripping `job` back out of the RESULT
        # vector -- both alerts therefore rendered with the identical final
        # label set {alertname, namespace="datalake-storage",
        # severity="critical"}, so Alertmanager grouped/deduped them as one
        # alert and which summary won was unspecified. Fixed two ways: (1)
        # aggregate `by (namespace, job)` instead of `by (namespace)` alone
        # so `job` survives into the alert's own label set; (2) add a
        # static `cluster` label (`mon-data` / `lakekeeper-db`) so a human
        # reading the alert in Slack doesn't have to parse a job string to
        # know which database degraded. Selectors themselves are unchanged.
        {{- if gt (int .Values.landingDb.instances) 1 }}
        - alert: CNPGClusterUnhealthy
          expr: max by (namespace, job) (cnpg_pg_replication_streaming_replicas{namespace="datalake-storage", job="datalake-storage/mon-data"}) < {{ sub (int .Values.landingDb.instances) 1 }}
          for: 15m
          labels:
            severity: critical
            cluster: mon-data
          annotations:
            summary: CNPG cluster mon-data has fewer streaming replicas than expected
            description: >-
              cnpg_pg_replication_streaming_replicas (max across mon-data's pods,
              i.e. the primary's view) has been below
              {{ sub (int .Values.landingDb.instances) 1 }} for 15m -- HA is
              degraded. E5 was the RAID0-over-4-volumes VM with zero redundancy
              that CNPG replaces.
            incident: E5
        {{- end }}
        {{- if gt (int .Values.lakekeeperDb.instances) 1 }}
        - alert: CNPGClusterUnhealthy
          expr: max by (namespace, job) (cnpg_pg_replication_streaming_replicas{namespace="datalake-storage", job="datalake-storage/lakekeeper-db"}) < {{ sub (int .Values.lakekeeperDb.instances) 1 }}
          for: 15m
          labels:
            severity: critical
            cluster: lakekeeper-db
          annotations:
            summary: CNPG cluster lakekeeper-db has fewer streaming replicas than expected
            description: >-
              cnpg_pg_replication_streaming_replicas (max across lakekeeper-db's
              pods, i.e. the primary's view) has been below
              {{ sub (int .Values.lakekeeperDb.instances) 1 }} for 15m -- HA is
              degraded. E5 was the RAID0-over-4-volumes VM with zero redundancy
              that CNPG replaces.
            incident: E5
        {{- end }}

        # Plan 5 Task 1 review fix: NodeDiskPressure deleted. As written
        # (`node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} /
        # node_filesystem_size_bytes`) it carried no selector at all --
        # written when we owned the whole cluster. On the shared platform
        # cluster it would watch EVERY node's EVERY filesystem, including
        # nodes and tenants we don't own. Considered scoping it to our own
        # node pools instead (labels exist: pool=db, pool=avx2,
        # cpu=x86-64-v3) but rejected that in favor of deletion: node-level
        # disk health is the platform's operational responsibility on a
        # shared cluster, not a tenant's -- we don't own node remediation,
        # so paging ourselves about a platform node we cannot act on is
        # noise, not signal. E5 (the incident this alert traced to -- a
        # root disk filled by an unrotated Docker log) was a Gen-1
        # single-tenant-VM failure mode; the platform's own node-level
        # monitoring is the appropriate owner of its shared-cluster
        # equivalent now.

        # Plan 5 Task 1 review fix: ArgoAppOutOfSync deleted (resolving the
        # prior two-branched finding above rather than re-litigating it).
        # Our Argo CD Applications live on the hub cluster, not this one;
        # this platform's Prometheus runs on the tenant cluster and does
        # not scrape the hub, so argocd_app_info will never exist here.
        # Application sync health is hub-side and therefore the platform's
        # to monitor, not ours.
