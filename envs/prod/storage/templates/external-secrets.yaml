# Plan 5 Task 3 Step 4: Lakekeeper's Postgres secret-store encryption key
# (values.yaml's `lakekeeper.secretBackend.postgres.encryptionKeySecret`
# comment has the full "why not templated directly" rationale --
# argoproj/argo-cd#5202, helm-lookup incompatible with GitOps render).
#
# secretStoreRef targets the platform's ClusterSecretStore `platform`
# (ESO Kubernetes provider, remoteNamespace eso-secret-source, status
# Valid -- verified live 2026-08-06). remoteRef.key names the whole Secret
# object the platform provisions in eso-secret-source; remoteRef.property
# selects the field within it (ESO Kubernetes-provider semantics: `key`
# without `property` would JSON-encode the entire remote Secret instead of
# one field -- verified against external-secrets.io/latest/provider/kubernetes,
# 2026-08-06, not assumed from the earlier illustrative snippet this
# replaces).
#
# No secret values in Git: the remote Secret `lakekeeper-pg-encryption`
# in eso-secret-source is the platform's/owner's to provision out-of-band,
# same as every other credential this task wires.
#
# target.deletionPolicy (independent-review finding, 2026-08-07, resolved):
# live-verified against the pinned External Secrets 2.8.0 CRD on the
# running kind cluster (`kubectl explain externalsecret.spec.target.
# deletionPolicy`) -- the operator's own default really is `Retain`, same
# as the review's belief, now confirmed rather than assumed. Retain means:
# if the remote secret/property is deleted (credential revoked), ESO logs
# a refresh error and LEAVES the already-materialised Kubernetes Secret in
# place -- any workload still reading it keeps using the revoked
# credential indefinitely. Initial provisioning already fails loudly (a
# Secret that never existed blocks the consuming pod from starting); this
# is specifically the post-sync revocation gap, and Retain does not close
# it. Set explicitly to `Delete` on all three of this repo's
# ExternalSecrets (this file; envs/prod/compute and envs/prod/orchestration
# have the identical setting and this same comment, cross-referenced) --
# genuinely two-sided, chosen deliberately, not by default: Delete means a
# revoked/renamed/mistakenly-removed remote secret deletes the target
# Kubernetes Secret too, so the NEXT thing that needs it (a new pod, the
# next CronWorkflow tick) fails loudly with "secret not found" instead of
# silently running with a stale, possibly-revoked credential. A pod
# already running with the old value in its environment keeps running
# until its next restart either way -- Delete does not evict live
# in-memory credentials, only stops new consumers from picking up stale
# ones.
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lakekeeper-pg-encryption
  namespace: datalake-storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform
    kind: ClusterSecretStore
  target:
    name: lakekeeper-pg-encryption
    deletionPolicy: Delete
  data:
    - secretKey: encryptionKey
      remoteRef:
        key: lakekeeper-pg-encryption
        property: encryptionKey
{{- end }}
