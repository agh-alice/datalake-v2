# Plan 5 Task 3 Step 4: Trino's read-only `landing` catalog credentials
# (values.yaml's `trino.envFrom` comment -- Secret `landing-ro`, keys
# LANDING_RO_USER/LANDING_RO_PASSWORD, injected via envFrom so the target
# Secret's own keys must be named exactly that -- envFrom maps Secret keys
# straight to env var names). The `trino_ro` Postgres role itself is a
# one-time out-of-band creation against mon-data (hack/kind-up.sh's
# equivalent on kind, per values.yaml's `catalogs.landing` comment) -- not
# templated here, same as every other DB role in this repo.
#
# See envs/prod/storage/templates/external-secrets.yaml for the
# secretStoreRef/remoteRef shape rationale (identical here), and for the
# target.deletionPolicy: Delete rationale below (independent-review
# finding, 2026-08-07 -- ESO 2.8.0's default is Retain, live-verified,
# which would leave a revoked landing-ro credential materialised and in
# use indefinitely; identical comment there, not repeated here).
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: landing-ro
  namespace: datalake-compute
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: datalake
    kind: ClusterSecretStore
  target:
    name: landing-ro
    deletionPolicy: Delete
  data:
    - secretKey: LANDING_RO_USER
      remoteRef:
        key: landing-ro
        property: username
    - secretKey: LANDING_RO_PASSWORD
      remoteRef:
        key: landing-ro
        property: password
{{- end }}
