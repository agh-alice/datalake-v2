apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/instance: datalake-compute
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: trino
    app.kubernetes.io/version: "480"
    helm.sh/chart: trino-1.42.2
    trino.io/network-policy-protection: disabled
  name: trino-coordinator
  namespace: datalake-compute
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: coordinator
      app.kubernetes.io/instance: datalake-compute
      app.kubernetes.io/name: trino
  template:
    metadata:
      annotations:
        checksum/catalog-config: 514f77eaf11a9f369be33aa8ed88bf960bd49b281d67961d4b3815a0c696e885
        checksum/coordinator-config: 3d491652ff4b6bc8db0c184be43f882ba48a7538db4118e47965556dc6a4ba33
      labels:
        app.kubernetes.io/component: coordinator
        app.kubernetes.io/instance: datalake-compute
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: trino
        app.kubernetes.io/version: "480"
        helm.sh/chart: trino-1.42.2
        trino.io/network-policy-protection: disabled
    spec:
      containers:
        - env: []
          envFrom:
            - secretRef:
                name: landing-ro
          image: trinodb/trino@sha256:00125e40d063bc4816d165482f6044872b18b56026fb959d3b28ce1f96ffbbee
          imagePullPolicy: IfNotPresent
          lifecycle: {}
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          name: trino-coordinator
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /usr/lib/trino/bin/health-check
            failureThreshold: 6
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              memory: 3Gi
            requests:
              cpu: 250m
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command:
                - /usr/lib/trino/bin/health-check
            failureThreshold: 60
            initialDelaySeconds: 10
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 2
          volumeMounts:
            - mountPath: /etc/trino
              name: config-volume
            - mountPath: /etc/trino/catalog
              name: catalog-volume
            - mountPath: /etc/trino/schemas
              name: schemas-volume
      securityContext:
        runAsGroup: 1000
        runAsUser: 1000
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            name: trino-coordinator
          name: config-volume
        - configMap:
            name: trino-catalog
          name: catalog-volume
        - configMap:
            name: trino-schemas-volume-coordinator
          name: schemas-volume
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: landing-ro
  namespace: datalake-compute
spec:
  data:
    - remoteRef:
        key: landing-ro
        property: username
      secretKey: LANDING_RO_USER
    - remoteRef:
        key: landing-ro
        property: password
      secretKey: LANDING_RO_PASSWORD
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: datalake
  target:
    deletionPolicy: Delete
    name: landing-ro
---
apiVersion: v1
kind: Pod
metadata:
  annotations:
    helm.sh/hook: test
  labels:
    app.kubernetes.io/component: test
    app.kubernetes.io/instance: datalake-compute
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: trino
    app.kubernetes.io/version: "480"
    helm.sh/chart: trino-1.42.2
    test: connection
  name: trino-test-connection
spec:
  containers:
    - args:
        - trino://trino:8080
        - --user=admin
        - --debug
        - --execute=SELECT COUNT(*) FROM tpch.tiny.nation
        - --no-progress
      command:
        - trino
      image: trinodb/trino@sha256:00125e40d063bc4816d165482f6044872b18b56026fb959d3b28ce1f96ffbbee
      name: cli
  restartPolicy: Never
