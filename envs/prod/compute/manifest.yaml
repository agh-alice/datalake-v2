apiVersion: v1
data:
  lake.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://lakekeeper.datalake-storage.svc:8181/catalog
    iceberg.rest-catalog.warehouse=default
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.token=dummy
    iceberg.rest-catalog.vended-credentials-enabled=true
    fs.native-s3.enabled=true
    s3.endpoint=http://minio.minio.svc:9000
    s3.region=local-01
    s3.path-style-access=true
  landing.properties: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://mon-data-rw.datalake-storage.svc:5432/mon_data
    connection-user=${ENV:LANDING_RO_USER}
    connection-password=${ENV:LANDING_RO_PASSWORD}
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: catalogs
    app.kubernetes.io/instance: datalake-compute
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: trino
    app.kubernetes.io/version: "480"
    helm.sh/chart: trino-1.42.2
  name: trino-catalog
  namespace: datalake-compute
---
apiVersion: v1
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    query.max-memory=4GB
    query.max-memory-per-node=1GB
    discovery.uri=http://localhost:8080
  jvm.config: |
    -server
    -agentpath:/usr/lib/trino/bin/libjvmkill.so
    -Xmx2G
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -XX:-OmitStackTraceInFastThrow
    -XX:ReservedCodeCacheSize=512M
    -XX:PerMethodRecompilationCutoff=10000
    -XX:PerBytecodeRecompilationCutoff=10000
    -Djdk.attach.allowAttachSelf=true
    -Djdk.nio.maxCachedBufferSize=2000000
    # Allow loading dynamic agent used by JOL
    -XX:+EnableDynamicAgentLoading
  log.properties: |
    io.trino=INFO
  node.properties: |
    node.environment=production
    node.data-dir=/data/trino
    plugin.dir=/usr/lib/trino/plugin
kind: ConfigMap
metadata:
  labels:
