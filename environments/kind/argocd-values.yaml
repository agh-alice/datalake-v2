configs:
  params:
    server.insecure: true
    hydrator.enabled: "true"
commitServer:
  enabled: true
dex:
  enabled: false
# Execution-time deviation (Task 6 review finding, 2026-07-12): the ArgoAppOutOfSync
# alert (Task 6 / design D11) depends on argocd_app_info, which the application
# controller only exports once metrics are enabled -- Task 2's bootstrap never turned
# this on, so the alert was dead on arrival (loaded but could never fire). Enabling the
# metrics endpoint here; the chart's built-in serviceMonitor is intentionally NOT
# enabled -- on a clean-room kind-up ArgoCD installs before the Prometheus-operator
# CRDs exist, so a serviceMonitor: {enabled: true} here would fail to render/apply.
# The ServiceMonitor lives in chart/templates instead (chart/templates/argocd-
# servicemonitor.yaml), applied by the separate datalake-kind Application.
#
# Task 8 review finding (correcting the claim this comment used to make): there
# is no mechanically enforced ordering ("sync-wave ordering") that guarantees
# the Prometheus-operator CRDs exist before a tier Application's own
# ServiceMonitor/PodMonitor/PrometheusRule resources render -- ArgoCD
# Applications applied as standalone objects (as environments/kind/infra/*.yaml
# and environments/kind/apps/*.yaml are here) each sync independently;
# sync-wave annotations only order resources within a single Application's
# own sync, not across separate Applications. Convergence instead relies on
# `syncPolicy.automated.selfHeal: true` (set on every Application in this
# repo): a sync that fails because a CRD is missing gets retried
# automatically, and once kube-prometheus-stack installs the CRD the next
# selfHeal pass succeeds. Treat this as eventual convergence, not guaranteed
# ordering.
#
# Plan 5 Task 1 retired chart/templates/argocd-servicemonitor.yaml outright
# (platform owns namespaces; ArgoCD is hub-side in prod, so a tenant chart
# monitoring THIS repo's own kind-local ArgoCD makes no sense as a real
# design). Nothing renders a ServiceMonitor for kind's ArgoCD any more --
# `controller.metrics.enabled: true` below still exposes the endpoint for
# a human to port-forward and inspect, but no PrometheusRule/ServiceMonitor
# in this repo depends on it (the correction above's older claim that "the
# ServiceMonitor lives in chart/templates instead" is stale as of that
# retirement; left uncorrected in git history, corrected here).
controller:
  metrics:
    enabled: true
# --- Execution-time deviation (Task 2, Steps 1-2, 2026-07-12) ---
# Chart argo/argo-cd 10.1.3 is the newest published chart at execution time, but it
# bundles appVersion v3.4.5 (Source Hydrator = alpha). ArgoCD v3.5.0 (Source Hydrator
# beta, incl. hydrator timeout/requeue fixes) has not GA'd yet -- only v3.5.0-rc1/rc2
# exist upstream, and no argo-helm chart version bundles v3.5.x. global.image.tag
# overrides the chart's default tag (Chart.AppVersion) for every core component
# (controller, repo-server, server, applicationset, commit-server, dex) via the shared
# `argo-cd.defaultTag` helper -- confirmed by reading templates/_common.tpl and every
# templates/argocd-*/deployment.yaml in chart 10.1.3. Pinning here to run actual v3.5
# hydrator code on top of the newest chart structure, instead of shipping the v3.4.5
# alpha-stability hydrator. Re-evaluate once v3.5.0 GA ships and a chart bundles it.
global:
  image:
    tag: v3.5.0-rc2
