# Kind-only (Plan 5 Task 4: moved from apps/infra/external-secrets.yaml --
# the platform provides External Secrets 2.8 in prod, per the plan's
# Context line; this Application is how kind gets the same operator, PLUS
# the `datalake` ClusterSecretStore (renamed from `platform` 2026-08-07)
# kind provisions itself -- see
# environments/kind/infra/cluster-secret-store.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  project: datalake
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # 2.8.0 is newest stable per `helm search repo external-secrets/
    # external-secrets --versions`, verified 2026-08-06 -- matches the
    # platform's own External Secrets 2.8 (plan Context line), was 2.7.0
    # before this bump. The ExternalSecret CRD's `v1` version (used by
    # every ExternalSecret this repo's tier charts render, and by
    # environments/kind/infra/cluster-secret-store.yaml's
    # ClusterSecretStore) is `served: true, storage: true` on this chart
    # version -- confirmed by pulling the chart and reading templates/
    # crds/clustersecretstore.yaml directly, not assumed from an older
    # v1beta1-only chart generation.
    targetRevision: "2.8.0"
    helm:
      valuesObject:
        installCRDs: true
  destination: {server: https://kubernetes.default.svc, namespace: external-secrets}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
