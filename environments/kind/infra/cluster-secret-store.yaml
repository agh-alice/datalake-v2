# Kind-only ClusterSecretStore `datalake` (Plan 5 Task 4 -- brief: "same
# name as production deliberately, so the ExternalSecrets in the charts
# are identical across environments"). The three tier charts' templates/
# external-secrets.yaml ExternalSecret objects (Task 3) all reference
# `secretStoreRef: {name: datalake, kind: ClusterSecretStore}` -- this is
# kind's own store under that same name, using ESO's Kubernetes provider
# (the same provider type the platform's real ClusterSecretStore uses).
#
# Renamed from `platform` to `datalake` on 2026-08-07: prod repointed its
# ExternalSecrets to a new, tenant-writable ClusterSecretStore named
# `datalake` (the platform's original `platform` store is read-only to
# this repo's owners) -- kind's mirror renames to match, keeping the
# "same store name across environments" invariant this file exists for.
# kind's own remoteNamespace (`eso-secret-source` below) is left
# unchanged -- it was never required to match prod's remoteNamespace
# (now eso-secret-source-datalake), only the ClusterSecretStore's own
# `name` needs to, since that is the only field the shared chart
# templates actually reference.
#
# NOT applied by an ArgoCD Application: this has an ordering dependency on
# the external-secrets Application's CRDs existing first (ClusterSecretStore
# is cluster-scoped and has no natural home inside a namespaced values-only
# Application anyway) -- hack/kind-up.sh applies this manifest directly
# with kubectl, after polling for the CRD, same "guarded poll before
# reading it" pattern the rest of that script already uses for lakekeeper/
# CNPG readiness.
#
# `eso-secret-source` is a plain kind-only namespace, harness-created by
# hack/kind-up.sh -- it holds the ACTUAL backing Secrets (lakekeeper-pg-
# encryption, landing-ro, ingest-env) that the tier charts' ExternalSecret
# objects pull from, one Secret object per remoteRef.key, fields selected
# via remoteRef.property (ESO Kubernetes-provider semantics -- see any
# tier chart's templates/external-secrets.yaml for the full citation).
apiVersion: v1
kind: Namespace
metadata:
  name: eso-secret-source
---
# Minimal read-only RBAC (Kubernetes-provider auth.serviceAccount contract,
# external-secrets.io/latest/provider/kubernetes): the ClusterSecretStore
# authenticates AS this ServiceAccount's token when reading Secrets out of
# remoteNamespace -- get/list/watch on secrets, scoped to this one
# namespace only, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-store-reader
  namespace: eso-secret-source
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-store-reader
  namespace: eso-secret-source
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-store-reader
  namespace: eso-secret-source
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-store-reader
subjects:
  - kind: ServiceAccount
    name: eso-store-reader
    namespace: eso-secret-source
---
# apiVersion v1 (not v1beta1): confirmed against the pulled 2.8.0 chart's
# own CRD (templates/crds/clustersecretstore.yaml) -- version `v1` is
# `served: true, storage: true`; `v1beta1` is `served:
# {{ .Values.crds.unsafeServeV1Beta1 }}` (default false) and `storage:
# false` -- same promotion this repo's ExternalSecret templates already
# assume (external-secrets.io/v1).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: datalake
spec:
  provider:
    kubernetes:
      remoteNamespace: eso-secret-source
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          # kube-root-ca.crt is auto-populated by Kubernetes in every
          # namespace (root-ca-cert-publisher controller) -- no manual
          # creation needed once eso-secret-source exists.
          name: kube-root-ca.crt
          namespace: eso-secret-source
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-store-reader
          namespace: eso-secret-source
