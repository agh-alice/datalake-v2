# Kind-only (Plan 5 Task 4: moved from apps/infra/argo-workflows.yaml --
# the platform provides Argo Workflows v4.0.8, scoped to
# datalake-orchestration, per the plan's Context line; this Application is
# how kind gets the same operator, wired the same way).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  project: datalake
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    # 1.0.23 (appVersion v4.0.8) is newest stable per `helm search repo
    # argo/argo-workflows --versions`, verified 2026-08-06 -- matches the
    # platform's own Argo Workflows v4.0.8 (plan Context line), was 1.0.19
    # (appVersion v4.0.7) before this bump. Prometheus CRDs already exist
    # on this kind cluster by the time this Application syncs (sync-wave
    # ordering vs. monitoring, same caveat as before: eventual convergence
    # via selfHeal, not a hard guarantee -- see environments/kind/
    # argocd-values.yaml's comment), so controller.serviceMonitor.enabled:
    # true is safe here.
    targetRevision: "1.0.23"
    helm:
      valuesObject:
        controller:
          metricsConfig: {enabled: true}
          # additionalLabels: release: monitoring (independent-review
          # finding, 2026-08-07, caught live post-fix, not one of the
          # original four): kind's Prometheus selector tightening
          # (environments/kind/infra/monitoring.yaml, finding 3) dropped
          # this ServiceMonitor's scrape target the moment it synced --
          # confirmed live: argo_workflows_total_count/
          # argo_workflows_cronworkflows_triggered_total (both consumed by
          # envs/prod/orchestration/templates/datalake-alerts.yaml's
          # WorkflowFailed/WorkflowChronicFailure exprs) had real
          # historical data up to the moment of the selector change, then
          # went empty -- a loaded-but-input-starved rule, exactly the
          # silent-monitoring-failure class finding 3 exists to kill, one
          # hop further downstream than the Prometheus CR itself. This
          # chart's bundled ServiceMonitor carries no release: monitoring
          # label of its own (separate Helm release, "argo-workflows", not
          # "monitoring") -- additionalLabels adds it back so kind's
          # now-tightened selector still adopts it. Same question applies
          # to prod: its platform-owned Prometheus almost certainly
          # doesn't adopt this ServiceMonitor either (separate release, no
          # release: monitoring label) -- these two alerts may already be
          # unfireable in prod today, independent of this kind fix;
          # flagged, not fixed here (this Application's chart source only
          # reaches kind, not the platform's own argo-workflows install).
          serviceMonitor: {enabled: true, additionalLabels: {release: monitoring}}
          # Task 4 fix (brief: "scoped to the orchestration namespace --
          # the chart default [\"default\"] would silently never run our
          # CronWorkflows"): confirmed live against the pulled chart's own
          # values.yaml (`helm show values argo/argo-workflows --version
          # 1.0.23`, 2026-08-06) -- `controller.workflowNamespaces`
          # defaults to `[default]`, not cluster-wide. Every CronWorkflow/
          # Workflow this repo renders lives in `datalake-orchestration`
          # (Plan 5 Task 1's namespace retarget) -- without this override
          # the controller would watch namespace `default` (where nothing
          # of ours exists) and every CronWorkflow tick would silently
          # never fire, no error, nothing to alert on.
          workflowNamespaces: [datalake-orchestration]
        workflow:
          serviceAccount: {create: false}
        server:
          enabled: true
          authModes: [server]
  destination: {server: https://kubernetes.default.svc, namespace: argo-workflows}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
