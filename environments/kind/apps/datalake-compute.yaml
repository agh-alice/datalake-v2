# Plan 5 Task 4 -- see datalake-storage.yaml's header comment for the
# shared rationale (tier-mirroring Application, no CreateNamespace=true,
# same reasons) and its destination.namespace + sourceHydrator.drySource.
# helm.namespace comment (live finding: Trino is a chart dependency too,
# Task 2 -- any of its upstream templates that don't self-declare a
# namespace need this set correctly; destination.namespace alone was NOT
# enough -- the Source Hydrator's documented "defaults to the app's
# destination namespace" fallback does not work on this ArgoCD version).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datalake-compute
  namespace: argocd
spec:
  project: datalake
  sourceHydrator:
    drySource:
      repoURL: https://github.com/agh-alice/datalake-v2.git
      targetRevision: main
      path: envs/prod/compute
      helm:
        valueFiles: [values.yaml, values-kind.yaml]
        namespace: datalake-compute
    syncSource:
      targetBranch: environments/kind
      path: envs/prod/compute
  destination:
    server: https://kubernetes.default.svc
    namespace: datalake-compute
  # See datalake-storage.yaml's identical block for the full rationale
  # (ESO CRD schema defaults several optional ExternalSecret fields this
  # chart's templates never set explicitly, which otherwise blocks Synced
  # forever even though live already matches every field that IS set).
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.creationPolicy
        - .spec.target.deletionPolicy
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
