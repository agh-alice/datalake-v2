# Plan 5 Task 4: one of the three tier-mirroring Applications that replace
# the old single-umbrella `datalake-kind` Application (environments/kind/
# apps/datalake.yaml, deleted). Points at the SAME chart prod uses
# (envs/prod/storage), differing only by values-kind.yaml -- the whole
# point of this rework (brief: "the harness stops being a divergent rig
# and becomes a mirror").
#
# Namespace `datalake-storage` is NOT created by this Application
# (no CreateNamespace=true, unlike the retired operator Applications) --
# on the prod tenant cluster the platform owns namespace creation; kind
# mirrors that division of responsibility by having hack/kind-up.sh
# pre-create all three `datalake-*` namespaces itself, before this
# Application's first sync (same reasoning as that script's existing
# lakekeeper/minio/dex/monitoring namespace pre-creation).
#
# destination.namespace IS set, AND sourceHydrator.drySource.helm.namespace
# is ALSO set explicitly (two live findings, Task 4 clean-room, same root
# cause): every hand-authored template in this chart hardcodes its own
# `metadata.namespace: datalake-storage` (Task 1's convention), so it
# didn't matter for the old single-umbrella Application -- but Lakekeeper
# is now a chart DEPENDENCY (Task 2), and its upstream templates rely on
# normal Helm release-namespace semantics for objects that don't
# self-declare one (e.g. templates/db-migration.yaml's Job, `namespace:
# {{ .Release.Namespace }}`).
#
# destination.namespace alone was NOT enough: the Application CRD's own
# schema says `sourceHydrator.drySource.helm.namespace` "defaults to the
# app's destination namespace" when left empty -- but live-verified
# (Task 4, ArgoCD chart 10.1.3 / appVersion v3.5.0-rc2) that default
# fallback does NOT work: the hydrator's own committed hydrator.metadata
# showed the exact command (`helm template . --name-template
# datalake-storage --values ... --include-crds`, no visible --namespace)
# and the resulting manifest.yaml had `namespace: argocd` baked into the
# Job -- this Application's OWN metadata.namespace, not
# destination.namespace, even after destination.namespace was set and
# re-applied. destination.namespace is still correct/needed (it is what
# governs where `kubectl apply` targets resources that DO lack a
# namespace at sync time) but is a DIFFERENT knob from what `helm
# template`'s `.Release.Namespace` resolves to during hydration -- this
# repo is on the Source Hydrator's rc2/beta channel (environments/kind/
# argocd-values.yaml's own comment), and the documented default-fallback
# behavior between the two evidently isn't implemented/working yet at
# this version. Setting `helm.namespace` explicitly bypasses whatever gap
# that is. Reproduced live before this fix: `kubectl -n argocd get
# application datalake-storage` tracked `lakekeeper-db-migration-1` as a
# resource in namespace `argocd` with `requiresPruning: true`, and
# ArgoCD's sync operation hung forever waiting for that hook Job (whose
# pod couldn't even start -- it references Secrets that live in
# `datalake-storage`, not `argocd`) to complete.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datalake-storage
  namespace: argocd
spec:
  project: datalake
  sourceHydrator:
    drySource:
      repoURL: https://github.com/agh-alice/datalake-v2.git
      targetRevision: main
      path: envs/prod/storage
      helm:
        valueFiles: [values.yaml, values-kind.yaml]
        namespace: datalake-storage
    syncSource:
      targetBranch: environments/kind
      path: envs/prod/storage
  destination:
    server: https://kubernetes.default.svc
    namespace: datalake-storage
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
