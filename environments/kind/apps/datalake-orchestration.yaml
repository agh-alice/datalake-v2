# Plan 5 Task 4 -- see datalake-storage.yaml's header comment for the
# shared rationale (tier-mirroring Application, no CreateNamespace=true,
# same reasons) and its destination.namespace comment (this chart has no
# dependencies today, all hand-authored templates self-declare their
# namespace -- set anyway for consistency with the other two tiers and as
# a forward guard against the same class of bug if a dependency is ever
# added here).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datalake-orchestration
  namespace: argocd
spec:
  project: datalake
  sourceHydrator:
    drySource:
      repoURL: https://github.com/agh-alice/datalake-v2.git
      targetRevision: main
      path: envs/prod/orchestration
      helm:
        valueFiles: [values.yaml, values-kind.yaml]
    syncSource:
      targetBranch: environments/kind
      path: envs/prod/orchestration
  destination:
    server: https://kubernetes.default.svc
    namespace: datalake-orchestration
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
